<style>
/* Layout: one-screen app — a top bar, one big question card in the middle, answer buttons below. Single bright theme by design. */
:root{
  color-scheme:light;
  --ink:#1f2a52;      /* text, outlines */
  --sky:#e9f0ff;      /* page ground */
  --card:#ffffff;
  --coral:#ff6a4d;    /* target spelling, primary action */
  --sun:#ffc94a;      /* highlights, stars */
  --mint:#25b38c;     /* correct */
  --rose:#e8536b;     /* wrong */
  --mute:#8a93b5;
  --line:#cfd9f2;
  --word:"Andika","Comic Sans MS",system-ui,sans-serif;     /* single-storey a and g for early readers */
  --display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
}
*{box-sizing:border-box}
*[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--word);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.screen{max-width:980px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:18px 28px}
/* home */
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:74px;height:74px;flex:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,6vw,56px);line-height:.95;margin:0;letter-spacing:.3px}
.tag{font-size:16px;color:var(--mute);margin-top:6px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mbtn{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:20px 22px;text-align:left;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:6px}
.mbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.mbtn .t{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05}
.mbtn .d{font-size:16px;color:#55607f}
.mbtn.main{background:var(--coral);color:#fff;grid-column:1/-1}
.mbtn.main .d{color:#fff;opacity:.92}
.mbtn.check{background:var(--sun)}
.days{font-size:15px;color:var(--mute)}
/* quiz */
.bar{display:flex;align-items:center;gap:12px}
.ibtn{border:3px solid var(--ink);background:var(--card);border-radius:14px;height:46px;min-width:46px;padding:0 14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.ibtn svg{width:22px;height:22px}
.dots{flex:1;display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--mint)}.dots i.bad{background:var(--rose)}.dots i.cur{background:var(--sun);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--sun)}
.prompt{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,30px);text-align:center;margin:0}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:250px;justify-content:center}
.chip{font-size:16px;font-weight:700;background:var(--sky);border-radius:999px;padding:4px 14px;color:#4a5578}
.pic{font-size:clamp(70px,12vh,110px);line-height:1}
.word{font-size:clamp(54px,9vw,96px);font-weight:700;letter-spacing:2px;line-height:1.1;font-variant-ligatures:none;text-align:center}
.word b{color:var(--coral);font-weight:700}
.word .blank.wide{width:1.9em}
.word .blank{display:inline-block;width:1.1em;border-bottom:7px solid var(--coral);margin:0 4px;vertical-align:baseline;height:.8em}
.ear{border:0;background:var(--coral);width:110px;height:110px;border-radius:50%;box-shadow:0 6px 0 #b8432f;display:grid;place-items:center}
.ear svg{width:58px;height:58px}
.slots{font-size:clamp(46px,7vw,78px);font-weight:700;letter-spacing:2px;min-height:1.3em;display:flex;gap:4px;align-items:flex-end;font-variant-ligatures:none}
.slots span{min-width:.8em;border-bottom:5px solid var(--line);text-align:center;padding:0 2px}
.slots span.f{border-color:var(--mint)}
.opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.opt{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);font-size:clamp(28px,4vw,40px);font-weight:700;padding:10px 26px;min-width:110px;font-variant-ligatures:none}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.opt.sm{font-size:clamp(24px,3.2vw,32px)}
.opt.grp{display:flex;align-items:center;gap:12px;font-size:clamp(24px,3.2vw,32px)}
.opt.grp .e{font-size:1.4em}
.opt.right{background:#dcf5ec;border-color:var(--mint);box-shadow:0 5px 0 var(--mint)}
.opt.wrong{background:#fde3e7;border-color:var(--rose);box-shadow:0 5px 0 var(--rose)}
.opt:disabled{opacity:.35}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.tip{background:#fff7dc;border:3px dashed #e3b341;border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:19px;font-weight:700}
.tip .ibtn{flex:none;background:var(--sun)}
/* end */
.endcard{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.stars{display:flex;gap:8px}.stars svg{width:64px;height:64px}
.big{font-family:var(--display);font-weight:800;font-size:40px;margin:0}
.res{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.res span{border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px}
.res .y{background:#dcf5ec}.res .n{background:#fde3e7}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pbtn{border:3px solid var(--ink);background:var(--coral);color:#fff;border-radius:16px;font-size:20px;font-weight:700;padding:10px 22px;box-shadow:0 4px 0 var(--ink)}
.pbtn.alt{background:var(--card);color:var(--ink)}
/* library + progress */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lcard{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;text-align:left;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:6px}
.lcard .n{font-family:var(--display);font-weight:800;font-size:22px}
.lcard .s{font-size:22px;font-weight:700;color:var(--coral);font-variant-ligatures:none}
.h2{font-family:var(--display);font-weight:800;font-size:26px;margin:6px 0 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.col{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.col h3{margin:0;font-size:34px;color:var(--coral);text-align:center;font-variant-ligatures:none}
.wchip{border:2px solid var(--line);background:#f7f9ff;border-radius:12px;padding:6px 10px;font-size:22px;font-weight:700;display:flex;gap:8px;align-items:center;font-variant-ligatures:none}
.wchip b{color:var(--coral)}
.prow{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prow .n{font-weight:700;min-width:130px}
.sk{border-radius:10px;padding:4px 10px;font-weight:700;font-size:17px;font-variant-ligatures:none;background:#eceff7;color:#7c86a6}
.sk.g{background:#cdeedd;color:#126b52}.sk.a{background:#ffeab0;color:#7a5600}.sk.r{background:#fbd3da;color:#9b1f37}
.ccols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.ccol{display:flex;flex-direction:column;gap:6px;background:#f7f9ff;border-radius:16px;padding:10px}
.ch{font-weight:700;font-size:18px;text-align:center}
.cq{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.6vw,26px);text-align:center;margin:6px 0 0;text-wrap:balance}
.qcard.clue{justify-content:flex-start}
.clueBtn{align-self:flex-start;border:3px solid var(--ink);background:var(--sun);border-radius:16px;font-size:20px;font-weight:700;padding:8px 18px;box-shadow:0 4px 0 var(--ink)}
.why{background:#eef7ff;border:3px dashed #7fb2e5;border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:18px;font-weight:700}
.why .ibtn{flex:none;background:#bfe0ff}
.lform{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lform input{flex:1 1 240px;min-width:0;font-family:var(--word);font-size:32px;font-weight:700;padding:8px 16px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink)}
.lform input:focus{outline:4px solid var(--sun)}
.lmsg{font-size:17px;color:#55607f;margin:0}
.lrecent{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wchip.sm{font-size:17px;padding:4px 10px}
.lout{display:flex;flex-direction:column;gap:16px;align-items:center}
.lword{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;justify-content:center;background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:18px 20px;width:100%}
.lg{border:0;border-radius:14px;padding:6px 10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-ligatures:none}
.lg .t{font-size:clamp(46px,8vw,80px);font-weight:700;line-height:1.05}
.lg .s{font-size:16px;font-weight:700;color:#55607f;min-height:1.2em}
.lg.silent .t{color:#a7afc9}
.lg.sm{font-size:24px;font-weight:700;padding:2px 10px;min-width:52px;text-align:center}
.ldot{font-size:48px;color:var(--mute);padding-bottom:28px}
.ltable{display:flex;flex-direction:column;gap:8px;width:100%;max-width:620px}
.lrow{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:20px}
.lk{border:0;background:none;color:var(--coral);font:inherit;font-weight:700;text-decoration:underline;padding:0;cursor:pointer}
.sbtns{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;min-width:64px;box-shadow:0 3px 0 var(--ink)}
.sbtn b{font-size:22px;color:var(--coral)}.sbtn span{font-size:14px;color:#55607f}
.lsnd{border:0;background:#fff0ec;color:var(--coral);font:inherit;font-weight:700;border-radius:8px;padding:0 8px;cursor:pointer}
.mean{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 18px;width:100%;max-width:760px;box-shadow:0 4px 0 var(--ink)}
.memo{font-size:clamp(56px,9vw,84px);line-height:1;flex:none}
.mtx{flex:1;min-width:0}
.mdef{font-size:22px;font-weight:700;margin:0 0 6px;line-height:1.35}
.mex{font-size:19px;margin:0;color:#4a5578;font-style:italic}
.mean .ibtn{flex:none;background:var(--sun)}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px;color:#55607f}
.reset{align-self:flex-start;background:none;border:0;color:var(--mute);text-decoration:underline;font-size:15px;padding:4px}
.reset.sure{color:var(--rose);font-weight:700}
@media (max-width:560px){.menu{grid-template-columns:1fr}.qcard{min-height:200px}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

<div id="home" class="screen">
  <div class="brand">
    <svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="34" cy="34" r="24" fill="#fff" stroke="#1f2a52" stroke-width="6"/><circle cx="34" cy="34" r="15" fill="#bfe0ff"/><path d="M52 52 72 72" stroke="#1f2a52" stroke-width="10" stroke-linecap="round"/><text x="34" y="42" text-anchor="middle" font-family="Andika,sans-serif" font-weight="700" font-size="22" fill="#ff6a4d">ai</text></svg>

</div>

<div id="quiz" class="screen" hidden>
  <div class="bar">
    <button class="ibtn" id="qHome"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Home</button>

<div id="lib" class="screen" hidden>
  <div class="bar"><button class="ibtn" data-home><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Home</button><p class="prompt" style="flex:1;text-align:left">Sound library</p></div>
  <div class="h2">Sound buttons</div><div class="sbtns" id="libSounds"></div>

<div id="detail" class="screen" hidden>
  <div class="bar"><button class="ibtn" id="dBack"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Library</button><p class="prompt" id="dTitle" style="flex:1;text-align:left"></p></div>

</div>

/* ---------- spelling helpers ---------- */
function locate(w,g){
  if(g.includes('-')){const m=w.match(new RegExp('^(.*?)'+g[0]+'([^aeiou]+)e(s?)$'));return m?{pre:m[1],g1:g[0],mid:m[2],g2:'e',post:m[3]}:null}
  const i=g==='y'?w.lastIndexOf('y'):w.indexOf(g);return i<0?null:{pre:w.slice(0,i),g1:g,mid:'',g2:'',post:w.slice(i+g.length)};
}
const hl=(w,g)=>{const L=locate(w,g);return L?`${L.pre}<b>${L.g1}</b>${L.mid}${L.g2?'<b>e</b>':''}${L.post}`:w};
/* a split spelling (a_e) hides the whole a?e stretch behind one wide blank, so the blank doesn't give the answer away */
const blank=(w,g)=>{const L=locate(w,g);return L.g2?`${L.pre}<span class="blank wide"></span>${L.post}`:`${L.pre}<span class="blank"></span>${L.post}`};
function respell(L,alt){return alt.includes('-')?L.pre+alt[0]+L.mid+L.post+'e':L.pre+alt+L.mid+L.post}

const level=id=>{const s=SAVE.sk[id];if(!s||!s.seen)return'';return s.box>=3?'g':s.box>=1?'a':'r'};

const au=new Audio();let tok=0;
function play(keys,done){tok++;const t=tok;const q=(Array.isArray(keys)?keys:[keys]).filter(k=>AUD[k]);

/* ---------- building a session ---------- */
function makeQ(id,avoid){
  const S=SK[id];let ws=S.words.filter(x=>!avoid.has(x.w));if(!ws.length)ws=S.words;const W=pick(ws);avoid.add(W.w);
  if(S.kind==='conf')return{id,type:'read',w:W.w};
  const L=locate(W.w,S.g),types=['choose','choose'];
  const vars=[...new Set(S.f.opts.filter(a=>a!==S.g&&!(a==='y'&&(S.f.id==='ee'||L.post||L.mid))).map(a=>respell(L,a)))].filter(v=>v!==W.w);
  if(!HOMO.has(W.w)&&vars.length)types.push('listen');
  if(!S.g.includes('-')&&W.w.length<=8)types.push('build');
  return{id,type:pick(types),w:W.w,e:W.e,L,vars:shuffle(vars).slice(0,2)};
}
function buildSession(mode){
  const d=today(),avoid=new Set();
  if(mode==='check'){
    const un=shuffle(IDS.filter(id=>!st(id).seen)),rest=shuffle(IDS.filter(id=>st(id).seen)).sort((a,b)=>st(a).box-st(b).box);
    return un.concat(rest).slice(0,20).map(id=>makeQ(id,avoid));
  }
  const score=id=>{const s=st(id);return(s.seen?0:2.5)+(s.seen&&s.due<=d?4:0)+(5-s.box)*1.1+(s.bad/(s.seen+1))*3+Math.random()*2.5};
  const top=IDS.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
  const ids=shuffle(top).concat(shuffle(top.slice(0,5)));
  for(let i=1;i<ids.length;i++)if(ids[i]===ids[i-1]){const j=(i+2)%ids.length;[ids[i],ids[j]]=[ids[j],ids[i]]}
  const Q=ids.map(id=>makeQ(id,avoid));
  const weak=[...new Set(top.filter(id=>SK[id].kind==='conf'&&st(id).box<2&&CLUE[SK[id].c.id]).map(id=>SK[id].c.id))];
  if(weak.length)Q.splice(5,0,{type:'clue',cid:pick(weak)});
  return Q;
}
/* "Find the clue": example words in two groups, then a question that leads to the rule */
function renderClue(card,opts,cid,onDone){
  const C=CLUE[cid],conf=CONF.find(c=>c.id===cid);card.innerHTML='';opts.innerHTML='';
  const cols=el('div','ccols');
  C.sets.forEach(s=>{const c=el('div','ccol',`<div class="ch">${s.e} ${esc(s.label)}</div>`);
    s.words.forEach(w=>{const b=el('button','wchip',`<span>${hl(w,conf.g)}</span>`);b.onclick=()=>play('w:'+w);c.append(b)});cols.append(c)});
  card.append(cols,el('p','cq',esc(C.q)));
  let missed=false,lock=false;
  C.opts.forEach(o=>{const b=el('button','opt sm',esc(o));b.onclick=()=>{if(lock||b.disabled)return;
    if(o===C.a){lock=true;b.classList.add('right');onDone(missed)}
    else{missed=true;b.classList.add('wrong');b.disabled=true;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');play('no')}};opts.append(b)});
}

    $('#qSay').onclick=()=>play('cq:'+q.cid);play(intro.concat('cq:'+q.cid));return;
  }
  const S=SK[q.id],wk='w:'+q.w;
  if(q.type==='choose'){
    card.append(el('span','chip',`${S.f.name} · like ${S.f.key}`));if(q.e)card.append(el('div','pic',q.e));
    const wd=el('div','word',blank(q.w,S.g));card.append(wd);q.show=()=>wd.innerHTML=hl(q.w,S.g);
    shuffle(S.f.opts).forEach(g=>opts.append(optBtn(lab(g),g===S.g,'')));
    $('#qSay').onclick=()=>play(wk);play(intro.concat(wk));
  }
  if(q.type==='listen'){
    const b=el('button','ear',EAR);b.setAttribute('aria-label','Hear the word');b.onclick=()=>play(wk);card.append(b);
    const wd=el('div','word');card.append(wd);q.show=()=>{wd.innerHTML=hl(q.w,S.g);if(q.e)b.outerHTML=`<div class="pic">${q.e}</div>`};
    shuffle([q.w,...q.vars]).forEach(v=>opts.append(optBtn(v,v===q.w,'sm')));
    $('#qSay').onclick=()=>play(wk);play(intro.concat(wk));
  }
  if(q.type==='read'){
    const c=S.c,wd=el('div','word',hl(q.w,c.g));card.append(el('span','chip',`What does ${c.g} say here?`),wd);q.show=()=>{};
    c.groups.forEach((gr,i)=>{const b=optBtn(`<span class="e">${gr.e}</span><span>like ${gr.key}</span>`,i===S.i,'grp');opts.append(b)});
    $('#qSay').onclick=()=>play(PR.read[0]);play(intro);
  }
  if(q.type==='build'){
    const L=q.L,need=[...L.pre,S.g,...L.post];
    const b=el('button','ear',EAR);b.setAttribute('aria-label','Hear the word');b.onclick=()=>play(wk);
    const sl=el('div','slots');need.forEach(()=>sl.append(el('span','','&nbsp;')));card.append(b,sl);
    q.show=()=>{sl.outerHTML=`<div class="word">${hl(q.w,S.g)}</div>`;if(q.e)b.outerHTML=`<div class="pic">${q.e}</div>`};
    const other=S.f.opts.filter(a=>a!==S.g&&!a.includes('-')&&!need.includes(a)).slice(0,2);
    const rnd=shuffle('bdfmnprst'.split('').filter(x=>!need.includes(x))).slice(0,1);
    let pos=0;
    shuffle(need.concat(other,rnd)).forEach(t=>{const o=el('button','opt sm',t);o.onclick=()=>{if(q.lock||o.disabled)return;
      if(t===need[pos]){o.disabled=true;sl.children[pos].textContent=t;sl.children[pos].className='f';pos++;if(pos===need.length)done(q)}
      else miss(q,o)};opts.append(o)});
    $('#qSay').onclick=()=>play(wk);play(intro.concat(wk));
  }
}
function optBtn(html,ok,cls){const b=el('button','opt '+cls,html);b.onclick=()=>{const q=G.Q[G.k];if(q.lock||b.disabled)return;
  if(ok){b.classList.add('right');done(q)}else{b.classList.add('wrong');b.disabled=true;miss(q,b)}};return b}
function miss(q,node){
  node.classList.remove('shake');void node.offsetWidth;node.classList.add('shake');
  if(!q.miss){q.miss=true;const S=SK[q.id],tid=S.kind==='fam'?S.f.id:S.c.id,tip=S.kind==='fam'?S.f.tip:S.c.tip;
    $('#tipTxt').textContent=tip;$('#tip').hidden=false;$('#tipSay').onclick=()=>play('tip:'+tid);play(['no','tip:'+tid])}
  else play('no');
}
function done(q){
  q.lock=true;q.show();record(q.id,!q.miss);G.res[G.k]=!q.miss;
  const after=['w:'+q.w];if(!q.miss&&Math.random()<.35)after.push('ok'+(1+Math.random()*3|0));
  play(after,()=>setTimeout(()=>{G.k++;if(G.k<G.Q.length)ask(false);else finish()},700));
}
function finish(){
  const n=G.res.filter(Boolean).length,t=G.Q.length,p=n/t,s=p>=.9?3:p>=.7?2:1;
  $('#eStars').innerHTML=[1,2,3].map(i=>STAR(i<=s)).join('');
  $('#eTitle').textContent=s===3?'Super detective!':s===2?'Great work!':'Good job!';
  $('#eSub').textContent=`${n} of ${t} right first time`;
  const seen={};G.Q.forEach((q,i)=>{const l=q.type==='clue'?'🔍 '+CONF.find(c=>c.id===q.cid).g+' clue':SK[q.id].label;seen[l]=(seen[l]??true)&&G.res[i]});
  $('#eRes').innerHTML=Object.entries(seen).map(([l,ok])=>`<span class="${ok?'y':'n'}">${ok?'✓':'✗'} ${l}</span>`).join('');
  show('end');play('end');
}

/* ---------- library ---------- */

  const lf=$('#libFam');lf.innerHTML='';
  FAM.forEach(f=>{const b=el('button','lcard',`<span class="n">${f.name}</span><span class="s">${f.opts.map(lab).join(' · ')}</span><span>${f.key}</span>`);b.onclick=()=>detail(f,'fam');lf.append(b)});

}
function wchip(w,g,e){const b=el('button','wchip',`${e?`<span>${e}</span>`:''}<span>${hl(w,g)}</span>`);b.onclick=()=>play('w:'+w);return b}
function detail(x,kind){

  else x.groups.forEach(gr=>{const c=el('div','col',`<h3>${gr.e} like ${gr.key}</h3>`);gr.words.forEach(w=>c.append(wchip(w,x.g,'')));cols.append(c)});
  const cb=$('#dClueBtn'),box=$('#dClue');box.hidden=true;cb.hidden=!(kind==='conf'&&CLUE[x.id]);
  cb.onclick=()=>{cb.hidden=true;box.hidden=false;play(['clue_intro','cq:'+x.id]);
    renderClue($('#dClueCard'),$('#dClueOpts'),x.id,()=>{$('#dClueOpts').innerHTML='<div class="cq">🔍 Clue found! Read the tip at the top.</div>';play('tip:'+x.id)})};
  show('detail');
}
$('#whyTxt').textContent=WHY;$('#whySay').onclick=()=>play('why');

$('#dBack').onclick=()=>show('lib');

/* ---------- progress ---------- */
function renderProg(){
  const box=$('#progRows');box.innerHTML='';
  FAM.forEach(f=>{const r=el('div','prow',`<span class="n">${f.name} <span style="font-weight:400">${f.key}</span></span>`);f.opts.forEach(g=>r.append(el('span','sk '+level(f.id+':'+g),lab(g))));box.append(r)});
  CONF.forEach(c=>{const r=el('div','prow',`<span class="n">${c.g}: two sounds</span>`);c.groups.forEach((gr,i)=>r.append(el('span','sk '+level(c.id+':'+i),`${gr.e} like ${gr.key}`)));box.append(r)});

$('#goProg').onclick=()=>{renderProg();show('prog')};
let rt=null;
$('#reset').onclick=()=>{const b=$('#reset');
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Tap again to delete all progress';clearTimeout(rt);rt=setTimeout(()=>{b.classList.remove('sure');b.textContent='Reset all progress'},4000);return}
  SAVE={sk:{},days:[]};persist();b.classList.remove('sure');b.textContent='Reset all progress';renderProg()};

/* ---------- Word helper: type any word, see its phonics breakdown ---------- */
const PAL=['#ffe1d9','#d9ecff','#dff5e8','#fff0c2','#eedcff','#ffdbe9'];
let LOOK={};try{LOOK=JSON.parse(localStorage.getItem('sd-lookups-3'))||{}}catch(e){}
const saveLook=()=>{try{localStorage.setItem('sd-lookups-3',JSON.stringify(LOOK))}catch(e){}};
let samplePromise=null;
const getSample=()=>samplePromise||(samplePromise=(window.claude&&claude.use?claude.use('sample').catch(()=>null):Promise.resolve(null)));
let sampleOff=false;

/* speech: the app's own recording when the word is in it, otherwise the browser's British voice */
let ukVoice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();ukVoice=vs.find(v=>/en-GB/i.test(v.lang)&&/Google|Serena|Kate|Daniel|Libby|Sonia/i.test(v.name))||vs.find(v=>/en-GB/i.test(v.lang))||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rate,onend){if(!window.speechSynthesis){onend&&onend();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';if(ukVoice)u.voice=ukVoice;u.rate=rate||.85;if(onend)u.onend=onend;speechSynthesis.speak(u)}
/* tap a letter group: its own sound first, then "like c in cat" */
const spell=g=>g.toUpperCase().split('').join(' ');
/* the example word: our own table first (it has a recorded "like C in cat" sentence), then Claude's suggestion */
const likeOf=p=>{const k=p.g.toLowerCase()+'|'+p.sound;return LIKE[k]?{w:LIKE[k],key:'lk:'+k}:{w:p.like||''}};
function sayPart(p){if(window.speechSynthesis)speechSynthesis.cancel();const L=likeOf(p);
  const tail=()=>{if(L.key&&AUD[L.key])return play(L.key);if(!L.w)return;if(AUD['w:'+L.w])speak(`like ${spell(p.g)} in`,.85,()=>play('w:'+L.w));else speak(`like ${spell(p.g)} in ${L.w}`)};
  if(AUD['ph:'+p.sound])play('ph:'+p.sound,()=>setTimeout(tail,250));else tail()}
function sayWord(w,slow){
  if(!slow&&AUD['w:'+w])return play('w:'+w);
  if(!window.speechSynthesis)return;stopAudio();speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';if(ukVoice)u.voice=ukVoice;u.rate=slow?.55:.85;speechSynthesis.speak(u);
}

/* offline fallback: group letters into common phonics spellings (no sounds) */
const GR='tch igh dge air ear ure ore are eer ch sh th ng ck ph wh qu kn wr mb ai ay ee ea oa ow ou oi oy oo ue ew ie ar or ur er ir aw au ll ss ff zz'.split(' ');
function guessParts(w){const out=[];let i=0;
  while(i<w.length){const g=GR.find(x=>w.startsWith(x,i))||w[i];out.push({g});i+=g.length}
  const m=w.match(/([aeiou])([^aeiou])e$/);if(m&&out.length>=3){const n=out.length;if(out[n-1].g==='e'&&out[n-3].g===m[1]){out[n-3].split=m[1]+'-e';out[n-1].silent=true;out[n-1].split=m[1]+'-e'}}
  return [{text:w,parts:out}];
}
const PROMPT=w=>`You are a phonics teacher in a UK primary school (Letters and Sounds). Break the English word "${w}" into syllables and graphemes for a 7-year-old, using British (RP) pronunciation.
Reply with only JSON like this example for "rainbow":
{"word":"rainbow","syllables":[{"text":"rain","parts":[{"g":"r","sound":"r","like":"red"},{"g":"ai","sound":"ai","like":"rain"},{"g":"n","sound":"n","like":"net"}]},{"text":"bow","parts":[{"g":"b","sound":"b","like":"bat"},{"g":"ow","sound":"oa","like":"snow"}]}],"tricky":null,"meaning":"A rainbow is a curve of bright colours in the sky. You can see it when the sun shines while it rains.","example":"Look, there's a rainbow over the park!","emoji":"🌈"}
Rules:
- "g" is the letters exactly as written. All "g" values joined in order must spell "${w}" exactly.
- Split digraph (cake, bike, home): give the vowel as its own part with "split":"a-e" (or i-e, o-e, u-e, e-e) and its long sound, and the final e as a part {"g":"e","sound":"","silent":true,"split":"a-e"}.
- Silent letters belong with their neighbour: "kn" in knee, "wr" in write, "mb" in lamb, "gh" in light is part of "igh".
- Use the natural British pronunciation, including vowels that are reduced or not said at all. Example: "chocolate" is said "choc-lut", so give {"text":"choc","parts":[ch,o,c]} and {"text":"olate","parts":[o (silent), l, a (sound "uh"), t, e (silent)]}.
- Only mark a split digraph when the vowel really is long, as in cake or bike. Never in unstressed endings like chocolate, climate or palace.
- "sound" must be exactly one of these labels: a e i o u (short vowels, as in cat bed pig dog sun), ai ee igh oa oo (long), oo-short (book), ar or ur ow oi air ear ure, uh (an unstressed vowel, like the a in banana), s z f v m n l r sh th ng zh h p b t d k g ch j w y ks kw. Use "" only for a silent letter.
- "like" is a very common short word with the same sound, ideally the same spelling.
- "tricky": if part of the word does not follow the usual phonics rules, one short simple English sentence for a child about that part; otherwise null.
- "meaning": what the word means, in one or two short sentences a 7-year-old can read (simple words, no dictionary style). If it has several meanings, give the most common one for children.
- "example": one short, friendly example sentence using the word.
- "emoji": 1 to 3 emoji that show the word, or "" if no emoji fits (for words like "the" or "because").
If "${w}" is not an English word, reply {"error":"not a word"}.`;

function renderLook(w,data,guess){
  const box=$('#lookOut');box.innerHTML='';
  const parts=data.syllables.flatMap(s=>s.parts);
  if(parts.map(p=>p.g).join('').toLowerCase()!==w){box.append(el('p','lmsg','Sorry, that did not work. Please try again.'));return}
  // colour: each grapheme its own colour; a split digraph shares the vowel's colour
  let ci=0;const col=[];parts.forEach((p,i)=>{if(p.silent&&p.split){const v=parts.findIndex(q=>q.split===p.split&&!q.silent);col[i]=col[v]??PAL[0]}else col[i]=PAL[(ci++)%PAL.length]});
  const big=el('div','lword');let k=0;
  data.syllables.forEach((s,si)=>{if(si)big.append(el('span','ldot','·'));
    s.parts.forEach(p=>{const i=k++;const b=el('button','lg'+(p.silent?' silent':''),`<span class="t">${esc(p.g)}</span><span class="s">${p.silent?'silent':esc(p.sound||'')}</span>`);
      b.style.background=col[i];b.onclick=()=>{if(!p.silent)sayPart(p)};big.append(b)})});
  const ctl=el('div','row');const s1=el('button','pbtn','▶ Say it'),s2=el('button','pbtn alt','▶ Slowly');
  s1.onclick=()=>sayWord(w);s2.onclick=()=>sayWord(w,true);ctl.append(s1,s2);
  box.append(big,ctl);
  if(!guess&&data.meaning){
    const m=el('div','mean');if(data.emoji)m.append(el('div','memo',esc(data.emoji)));
    const tx=el('div','mtx',`<p class="mdef">${esc(data.meaning)}</p>${data.example?`<p class="mex">“${esc(data.example)}”</p>`:''}`);
    const sp=el('button','ibtn','<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/></svg>');sp.setAttribute('aria-label','Hear the meaning');
    sp.onclick=()=>{stopAudio();speak(data.meaning+(data.example?' For example: '+data.example:''),.9)};
    m.append(tx,sp);box.append(m)}
  if(guess){box.append(el('p','lmsg',window.claude?'Letter groups only. To see the sounds, allow this page to use Claude (a grown-up can do this).':'Letter groups only. New words get their full sounds in the computer version.'));return}
  if(data.syllables.length>1)box.append(el('p','lmsg',`${data.syllables.length} syllables: ${data.syllables.map(s=>esc(s.text)).join(' · ')}`));
  const tb=el('div','ltable');
  parts.forEach((p,i)=>{if(p.silent){tb.append(el('div','lrow',`<span class="lg sm" style="background:${col[i]}">${esc(p.g)}</span><span>is silent here${p.split?` (it works with the vowel: ${esc(p.split.replace('-','_'))})`:''}</span>`));return}
    const L=likeOf(p);
    const r=el('div','lrow',`<span class="lg sm" style="background:${col[i]}">${esc(p.g)}</span><span>says <button class="lsnd">${esc(p.sound)}</button>${L.w?`, like ${esc(p.g)} in <button class="lk">${esc(L.w)}</button>`:''}</span>`);
    r.querySelector('.lsnd').onclick=()=>{if(AUD['ph:'+p.sound])play('ph:'+p.sound)};
    const lk=r.querySelector('.lk');if(lk)lk.onclick=()=>sayWord(L.w);tb.append(r)});
  box.append(tb);
  if(data.tricky)box.append(el('div','tip',`<span>🔍 ${esc(data.tricky)}</span>`));
  // link to the matching family in the library
  const fam=FAM.find(f=>f.opts.some(g=>parts.some(p=>(p.split||p.g)===g)&&f.opts.length>1&&!['n','r','w','f'].includes(g)));
  if(fam){const b=el('button','clueBtn',`📚 More ${esc(fam.name)} words`);b.onclick=()=>{renderLib();detail(fam,'fam')};box.append(b)}
}
async function lookUp(raw){
  const w=String(raw||'').toLowerCase().trim().replace(/[^a-z'-]/g,'');
  if(!w){$('#lookIn').focus();return}
  $('#lookIn').value=w;renderRecent();
  if(LOOK[w])return renderLook(w,LOOK[w]);
  const sample=sampleOff?null:await getSample();
  if(!sample){renderLook(w,{syllables:guessParts(w)},true);return}
  $('#lookOut').innerHTML='<p class="lmsg">Thinking…</p>';$('#lookGo').disabled=true;
  try{
    const d=await sample.json(PROMPT(w),{modelTier:'default',effort:'low',cache:{gcTime:864e5}});
    if(d&&d.error){$('#lookOut').innerHTML=`<p class="lmsg">“${esc(w)}” doesn't look like an English word. Check the spelling?</p>`;return}
    if(!d||!Array.isArray(d.syllables))throw{code:'invalid_json'};
    LOOK[w]=d;saveLook();renderRecent();renderLook(w,d);
  }catch(e){
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){sampleOff=true;renderLook(w,{syllables:guessParts(w)},true)}
    else $('#lookOut').innerHTML=`<p class="lmsg">${e.code==='rate_limited'?'Too many words at once. Wait a minute and try again.':'Something went wrong. Please try again.'}</p>`;
  }finally{$('#lookGo').disabled=false}
}
function renderRecent(){const r=$('#lookRecent');r.innerHTML='';const ws=Object.keys(LOOK).slice(-12).reverse();
  if(ws.length)r.append(el('span','lmsg','Recent:'));ws.forEach(w=>{const b=el('button','wchip sm',esc(w));b.onclick=()=>lookUp(w);r.append(b)})}
$('#goLook').onclick=()=>{renderRecent();show('look');setTimeout(()=>$('#lookIn').focus(),50)};
$('#lookForm').onsubmit=e=>{e.preventDefault();lookUp($('#lookIn').value)};

const PEX={a:'cat',e:'bed',i:'pig',o:'dog',u:'sun','oo-short':'book',ai:'rain',ee:'tree',igh:'night',oa:'goat',oo:'moon',ar:'car',or:'fork',ur:'bird',ow:'cow',oi:'coin',air:'chair',ear:'ear',uh:'banana',
 s:'sun',z:'zoo',f:'fish',v:'van',m:'man',n:'net',l:'leg',r:'red',sh:'ship',th:'thumb',ng:'ring',zh:'treasure',h:'hat',p:'pen',b:'bat',t:'top',d:'dog',k:'kite',g:'goat',ch:'chip',j:'jam',w:'web',y:'yes',ks:'box',kw:'queen'};
function renderSounds(){const box=$('#libSounds');if(box.childElementCount)return;
  PHON.forEach(l=>{const b=el('button','sbtn',`<b>${esc(l)}</b><span>${esc(PEX[l]||'')}</span>`);
    b.onclick=()=>play('ph:'+l,()=>setTimeout(()=>sayWord(PEX[l]),250));box.append(b)})}
const _goLib=$('#goLib').onclick;$('#goLib').onclick=()=>{renderSounds();_goLib()};

goHome();
</script>
